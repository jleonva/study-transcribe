<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Transcribe</title><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"></head>
<body><main><h1>Study Transcribe</h1><p class="muted">Prepare local PDFs for transcription without changing source files.</p>
<section class="card"><label>Input folder<div class="folder-picker"><input id="folder" placeholder="C:\\Books"><button type="button" onclick="selectFolder(this, 'folder', 'Select input folder')">Select folder</button></div></label><label>Output root<div class="folder-picker"><input id="output" value="{{ default_output }}"><button type="button" onclick="selectFolder(this, 'output', 'Select output folder')">Select folder</button></div></label><button id="scan">Scan folder</button> <span id="scan-status" class="muted"></span></section>
<section class="card"><h2>Scanned PDFs</h2><div id="files">Scan a folder to begin.</div></section><section class="card"><h2>Queue</h2><button id="start">Run all jobs</button><div id="jobs"></div></section></main><script src="{{ url_for('static', filename='app.js') }}"></script></body></html>
